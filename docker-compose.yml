services:

  backend:
    image: 592668326593.dkr.ecr.us-east-1.amazonaws.com/farmer-backend:latest
    container_name: farmer-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always

  frontend:
    image: 592668326593.dkr.ecr.us-east-1.amazonaws.com/farmer-frontend:latest
    container_name: farmer-frontend
    ports:
      - "4000:3000"
    environment:
      - BACKEND_HOST=backend
      - BACKEND_PORT=8000
    depends_on:
      - backend
    restart: always
