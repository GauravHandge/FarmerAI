name: FarmerAI CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Connect GitHub Actions to AWS using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::592668326593:role/farmer-github-actions-role
          aws-region: us-east-1

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build Backend Docker image
      - name: Build Backend Docker Image
        run: |
          docker build -f backend/Dockerfile -t farmer-backend .

      # 5. Build Frontend Docker image
      - name: Build Frontend Docker Image
        run: |
          docker build -t farmer-frontend .

      # 6. Tag Docker images
      - name: Tag Docker Images
        run: |
          docker tag farmer-backend:latest 592668326593.dkr.ecr.us-east-1.amazonaws.com/farmer-backend:latest
          docker tag farmer-frontend:latest 592668326593.dkr.ecr.us-east-1.amazonaws.com/farmer-frontend:latest

      # 7. Push images to ECR
      - name: Push Images to ECR
        run: |
          docker push 592668326593.dkr.ecr.us-east-1.amazonaws.com/farmer-backend:latest
          docker push 592668326593.dkr.ecr.us-east-1.amazonaws.com/farmer-frontend:latest

      # 8. Deploy latest images to EC2
      - name: Deploy to EC2
        run: |
          aws ssm send-command \
            --instance-ids i-0edcfbf41ed2be39b \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 592668326593.dkr.ecr.us-east-1.amazonaws.com",
              "docker pull 592668326593.dkr.ecr.us-east-1.amazonaws.com/farmer-backend:latest",
              "docker pull 592668326593.dkr.ecr.us-east-1.amazonaws.com/farmer-frontend:latest",
              "docker stop farmer-backend || true",
              "docker rm farmer-backend || true",
              "docker stop farmer-frontend || true",
              "docker rm farmer-frontend || true",
              "docker run -d --name farmer-backend -p 8000:8000 592668326593.dkr.ecr.us-east-1.amazonaws.com/farmer-backend:latest",
              "docker run -d --name farmer-frontend -p 4000:3000 592668326593.dkr.ecr.us-east-1.amazonaws.com/farmer-frontend:latest"
            ]' \
            --comment "Deploy FarmerAI"